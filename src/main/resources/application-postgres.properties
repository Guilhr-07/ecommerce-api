# Perfil "postgres" (docker compose / produção): SPRING_PROFILES_ACTIVE=postgres.
# O schema é criado e versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate só confere se as entidades batem com o banco e falha na subida se não baterem.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Console H2 não faz sentido fora do H2.
spring.h2.console.enabled=false

# Com seed via data.sql o JPA precisa rodar antes dos scripts; com Flyway é o contrário.
spring.jpa.defer-datasource-initialization=false

# Sem default de propósito: sem JWT_SECRET a aplicação falha na subida em vez de
# assinar tokens com uma chave que está publicada no repositório.
app.jwt.secret=${JWT_SECRET}

# Primeiro admin: se o usuário com este email já estiver registrado, vira ADMIN na subida
# (config/AdminBootstrap). Vazio = não faz nada. Nunca cria conta nem senha.
app.admin.email=${ADMIN_EMAIL:}
