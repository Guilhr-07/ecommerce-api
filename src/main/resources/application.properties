spring.application.name=ecommerce-api

# Banco: PostgreSQL em produção; cai para H2 em memória se as vars não existirem.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

# JWT — em produção, defina JWT_SECRET (>= 32 chars) por variável de ambiente.
app.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
app.jwt.expiration-seconds=3600

# Upload de imagens
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OpenAPI / Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
