# Perfil de testes: H2 isolado, seeder desligado (@Profile("!test")) e segredo JWT fixo.
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:ecommerce_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=segredo-de-teste-com-no-minimo-32-caracteres-1234
app.jwt.expiration-seconds=3600
app.upload.dir=${java.io.tmpdir}/ecommerce-test-uploads
